name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  # Build provenance (actions/attest-build-provenance): the attestation is signed with the
  # workflow's OIDC identity and stored in GitHub's attestation store.
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      # What the attest step did ("success", "failure", "skipped"), read by attestation-check.
      image_attestation: ${{ steps.attest_image.outcome }}
    steps:
      - uses: actions/checkout@v4

      # QEMU registers binfmt handlers for non-native architectures. The Go
      # build itself cross-compiles and does not need them (the builder stage is
      # pinned to BUILDPLATFORM), but buildx still needs to be able to inspect
      # and assemble the arm64 image, and any future RUN in a target-arch stage
      # would silently fail without this.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # The default "docker" driver cannot build more than one platform at a
      # time. buildx installs the docker-container driver, which can, and which
      # pushes a manifest list rather than a single-platform manifest.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Images through 0.11.0 were amd64-only, so no arm64 node could pull
          # them: not Graviton, and not a kind/k3d cluster on an Apple Silicon
          # Mac. Both platforms here make this push a manifest list.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Provenance for the image: the digest of the manifest list that was pushed, so
      # `gh attestation verify oci://ghcr.io/dorgu-ai/dorgu-operator:<version> --owner dorgu-ai`
      # checks what the tag resolves to.
      #
      # Attestation never blocks a release: a failure here would leave an image pushed with no
      # chart and no GitHub release (the chart and release jobs need this one). So it is
      # continue-on-error, and the attestation-check job at the end turns a skipped attestation
      # into a red run with an error annotation and a summary.
      - name: Attest image build provenance
        id: attest_image
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  helm:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    needs: [docker]
    outputs:
      archive_attestation: ${{ steps.attest_archive.outcome }}
      chart_attestation: ${{ steps.attest_chart.outcome }}
    env:
      # e.g. v0.1.0 -> 0.1.0
      CHART_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.0"

      - name: Set chart version
        id: version
        run: |
          VERSION="${CHART_VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/dorgu-operator/Chart.yaml
          sed -i "s/^version:.*/version: ${VERSION}/" charts/dorgu-operator/Chart.yaml

      - name: Set up Go (for controller-gen)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Copy latest CRD into chart
        run: |
          make manifests
          cp config/crd/bases/*.yaml charts/dorgu-operator/crds/

      - name: Package chart
        run: helm package charts/dorgu-operator -d dist/

      # Provenance for the chart archive that is attached to the GitHub release.
      - name: Attest chart archive build provenance
        id: attest_archive
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/dorgu-operator-*.tgz

      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Push chart to GHCR OCI
        id: push
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          helm push dist/dorgu-operator-${VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/dorgu-operator-charts 2>&1 | tee push.log
          # helm prints "Digest: sha256:..." for the pushed OCI artifact.
          DIGEST="$(awk '/^Digest:/ {print $2}' push.log)"
          test -n "${DIGEST}" || { echo "helm push printed no digest" >&2; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Provenance for the chart as it sits in the registry, so
      # `gh attestation verify oci://ghcr.io/dorgu-ai/dorgu-operator-charts/dorgu-operator:<version> --owner dorgu-ai` works.
      - name: Attest chart (OCI) build provenance
        id: attest_chart
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/dorgu-operator-charts/dorgu-operator
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [docker, helm]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Helm chart artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: dist/

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release_notes.md
          # Append install instructions
          cat >> release_notes.md << EOF

          ## Installation

          **Helm (recommended):**
          \`\`\`bash
          helm install dorgu-operator oci://ghcr.io/dorgu-ai/dorgu-operator-charts/dorgu-operator \\
            --version ${VERSION} \\
            --namespace dorgu-system \\
            --create-namespace
          \`\`\`

          **Docker image:**
          \`\`\`
          ghcr.io/dorgu-ai/dorgu-operator:${VERSION}
          \`\`\`
          EOF

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Dorgu Operator ${{ github.ref_name }}" \
            --notes-file release_notes.md \
            dist/*.tgz

  # Runs last, whatever happened before, and fails loudly when an attestation did not happen.
  # It blocks nothing: the image, the chart and the release are already published by now.
  attestation-check:
    name: Check build provenance attestations
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [docker, helm, github-release]
    steps:
      - name: Fail if any attestation was skipped
        env:
          IMAGE: ${{ needs.docker.outputs.image_attestation }}
          ARCHIVE: ${{ needs.helm.outputs.archive_attestation }}
          CHART: ${{ needs.helm.outputs.chart_attestation }}
        run: |
          missing=0
          details=""
          for pair in "image:${IMAGE}" "chart archive:${ARCHIVE}" "chart (OCI):${CHART}"; do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            if [ "${outcome}" != "success" ]; then
              missing=1
              echo "::error title=Attestation missing::the ${name} has NO build provenance attestation (outcome: ${outcome:-not run}). The release itself was published; re-run the attest step or file it as a release defect."
              details="${details}- **${name}**: not attested (outcome: ${outcome:-not run})"$'\n'
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            {
              echo "### Build provenance attestation was skipped"
              printf '%s' "${details}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All attestations were created." >> "$GITHUB_STEP_SUMMARY"
