name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU registers binfmt handlers for non-native architectures. The Go
      # build itself cross-compiles and does not need them (the builder stage is
      # pinned to BUILDPLATFORM), but buildx still needs to be able to inspect
      # and assemble the arm64 image, and any future RUN in a target-arch stage
      # would silently fail without this.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # The default "docker" driver cannot build more than one platform at a
      # time. buildx installs the docker-container driver, which can, and which
      # pushes a manifest list rather than a single-platform manifest.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Images through 0.11.0 were amd64-only, so no arm64 node could pull
          # them: not Graviton, and not a kind/k3d cluster on an Apple Silicon
          # Mac. Both platforms here make this push a manifest list.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  helm:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    needs: [docker]
    env:
      # e.g. v0.1.0 -> 0.1.0
      CHART_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.0"

      - name: Set chart version
        id: version
        run: |
          VERSION="${CHART_VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/dorgu-operator/Chart.yaml
          sed -i "s/^version:.*/version: ${VERSION}/" charts/dorgu-operator/Chart.yaml

      - name: Set up Go (for controller-gen)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Copy latest CRD into chart
        run: |
          make manifests
          cp config/crd/bases/*.yaml charts/dorgu-operator/crds/

      - name: Package chart
        run: helm package charts/dorgu-operator -d dist/

      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Push chart to GHCR OCI
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          helm push dist/dorgu-operator-${VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/dorgu-operator-charts

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [docker, helm]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Helm chart artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: dist/

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release_notes.md
          # Append install instructions
          cat >> release_notes.md << EOF

          ## Installation

          **Helm (recommended):**
          \`\`\`bash
          helm install dorgu-operator oci://ghcr.io/dorgu-ai/dorgu-operator-charts/dorgu-operator \\
            --version ${VERSION} \\
            --namespace dorgu-system \\
            --create-namespace
          \`\`\`

          **Docker image:**
          \`\`\`
          ghcr.io/dorgu-ai/dorgu-operator:${VERSION}
          \`\`\`
          EOF

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Dorgu Operator ${{ github.ref_name }}" \
            --notes-file release_notes.md \
            dist/*.tgz
