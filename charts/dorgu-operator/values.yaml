# Default values for dorgu-operator.

replicaCount: 1

image:
  repository: ghcr.io/dorgu-ai/dorgu-operator
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Webhook configuration
webhook:
  enabled: false
  mode: advisory  # advisory | enforcing
  port: 9443

# Validation settings
validation:
  requeueInterval: 60s

# Leader election
leaderElection:
  enabled: true

# Operator bootstrap behavior
operator:
  # Auto-create a default ClusterPersona named 'dorgu-cluster' on startup if none exists.
  # Set to false if you manage ClusterPersonas via GitOps and do not want operator interference.
  autoCreateClusterPersona: true

# Application discovery: auto-creates skeleton personas for unmanaged workloads.
# Incidents are detected for auto-discovered personas; remediations are only proposed
# after explicit promotion via `dorgu persona discover`.
discovery:
  enabled: true
  excludeNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
    - dorgu-system
    - monitoring
    - cert-manager
    - ingress-nginx
    - argocd
    - flux-system
    - cattle-system
    - local-path-storage

# Metrics
metrics:
  enabled: true
  bindAddress: ":8443"
  secure: true

# Health probes
healthProbe:
  bindAddress: ":8081"

# ArgoCD integration
argocd:
  enabled: true  # Enable ArgoCD Application watching

# Prometheus integration for resource baseline learning
prometheus:
  enabled: false
  url: ""  # e.g., http://prometheus-server.monitoring:9090

# WebSocket server for CLI real-time communication
websocket:
  enabled: false
  port: 9090
  # Service configuration for WebSocket
  service:
    type: ClusterIP
    port: 9090

# Health check reconciler — enables Phase 2a/2b detection, diagnosis, and remediation
healthCheck:
  enabled: false
  interval: 60s

# Metrics-server integration for container-level CPU/memory detection
metricsServer:
  enabled: true

# LLM for AI-enhanced diagnosis (Phase 2b)
# Prefer env vars (ANTHROPIC_API_KEY / GEMINI_API_KEY) over apiKey for production
llm:
  provider: ""  # "claude" or "gemini"; leave empty to disable AI diagnosis
  apiKey: ""    # overrides env var; use a K8s Secret + envFrom for production
  model: ""     # leave empty to use the provider default model

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
