---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: incidentmemories.dorgu.io
spec:
  group: dorgu.io
  names:
    kind: IncidentMemory
    listKind: IncidentMemoryList
    plural: incidentmemories
    shortNames:
    - im
    singular: incidentmemory
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.category
      name: Category
      type: string
    - jsonPath: .spec.severity
      name: Severity
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.detection.signal
      name: Signal
      type: string
    - jsonPath: .spec.personaRef.name
      name: Persona
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          IncidentMemory is the Schema for the incidentmemories API.
          It records a detected incident, its diagnosis, and resolution for organizational learning.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of IncidentMemory.
            properties:
              category:
                description: Category classifies the incident type.
                enum:
                - resource
                - scaling
                - health
                - security
                - deployment
                - dependency
                - node
                - controlplane
                type: string
              detection:
                description: Detection contains how the incident was discovered.
                properties:
                  affectedResources:
                    description: AffectedResources lists the K8s resources involved.
                    items:
                      description: ResourceReference identifies a Kubernetes resource
                        involved in an incident.
                      properties:
                        kind:
                          description: Kind of the K8s resource (Pod, Node, Deployment,
                            Service, etc.).
                          type: string
                        name:
                          description: Name of the resource.
                          type: string
                        namespace:
                          description: Namespace of the resource (empty for cluster-scoped).
                          type: string
                        role:
                          description: Role describes this resource's relationship
                            to the incident (e.g., "affected", "dependency", "upstream",
                            "downstream").
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    type: array
                  firstSeen:
                    description: FirstSeen is when the issue was first detected.
                    format: date-time
                    type: string
                  lastSeen:
                    description: LastSeen is when the issue was last observed.
                    format: date-time
                    type: string
                  signal:
                    description: Signal is the primary detection signal (e.g., OOMKilled,
                      CrashLoopBackOff, NodeNotReady).
                    type: string
                  source:
                    description: Source identifies which detector raised this (e.g.,
                      pod-failure-detector, node-health-checker).
                    type: string
                required:
                - affectedResources
                - firstSeen
                - lastSeen
                - signal
                - source
                type: object
              personaRef:
                description: PersonaRef references the affected Persona.
                properties:
                  kind:
                    description: Kind is ApplicationPersona or ClusterPersona.
                    enum:
                    - ApplicationPersona
                    - ClusterPersona
                    type: string
                  name:
                    description: Name of the referenced Persona.
                    type: string
                  namespace:
                    description: Namespace of the referenced Persona (empty for ClusterPersona).
                    type: string
                required:
                - kind
                - name
                type: object
              relatedResources:
                description: |-
                  RelatedResources tracks cross-namespace dependencies involved in this incident.
                  Designed for future cross-namespace correlation (e.g., app depends on db in another namespace).
                items:
                  description: ResourceReference identifies a Kubernetes resource
                    involved in an incident.
                  properties:
                    kind:
                      description: Kind of the K8s resource (Pod, Node, Deployment,
                        Service, etc.).
                      type: string
                    name:
                      description: Name of the resource.
                      type: string
                    namespace:
                      description: Namespace of the resource (empty for cluster-scoped).
                      type: string
                    role:
                      description: Role describes this resource's relationship to
                        the incident (e.g., "affected", "dependency", "upstream",
                        "downstream").
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              resolution:
                description: Resolution contains how the incident was resolved (populated
                  by Phase 2b remediation).
                properties:
                  action:
                    description: Action describes what remediation was applied.
                    type: string
                  appliedAt:
                    description: AppliedAt is when the remediation was applied.
                    format: date-time
                    type: string
                  duration:
                    description: Duration is how long from detection to resolution.
                    type: string
                  outcome:
                    description: |-
                      Outcome is the result of the remediation.
                      "acknowledged" means a human approved an advisory plan: the decision is
                      recorded, nothing was applied, and the incident is still open.
                    enum:
                    - resolved
                    - partial
                    - failed
                    - rollback
                    - acknowledged
                    type: string
                  remediationRef:
                    description: RemediationRef references the RemediationAction that
                      resolved this.
                    properties:
                      name:
                        description: Name of the RemediationAction.
                        type: string
                      namespace:
                        description: Namespace of the RemediationAction.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - action
                type: object
              rootCause:
                description: RootCause contains the diagnosis result.
                properties:
                  confidence:
                    description: Confidence is the diagnosis confidence score as a
                      decimal string (e.g., "0.85").
                    pattern: ^(0(\.\d+)?|1(\.0+)?)$
                    type: string
                  contributing:
                    description: Contributing lists signals that contributed to the
                      diagnosis.
                    items:
                      description: ContributingSignal is a signal that contributed
                        to a diagnosis.
                      properties:
                        detail:
                          description: Detail provides context about this signal's
                            contribution.
                          type: string
                        signal:
                          description: Signal is the contributing signal name.
                          type: string
                      required:
                      - detail
                      - signal
                      type: object
                    type: array
                  provider:
                    description: Provider identifies the diagnosis source (e.g., "rule-engine",
                      "ai-enhanced").
                    type: string
                  summary:
                    description: Summary is a human-readable explanation of the root
                      cause.
                    type: string
                required:
                - confidence
                - provider
                - summary
                type: object
              severity:
                description: Severity indicates the impact level.
                enum:
                - info
                - warning
                - critical
                type: string
            required:
            - category
            - detection
            - personaRef
            - severity
            type: object
          status:
            description: Status defines the observed state of IncidentMemory.
            properties:
              conditions:
                description: Conditions are standard K8s conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastOccurrence:
                description: LastOccurrence is the timestamp of the most recent occurrence.
                format: date-time
                type: string
              occurrenceCount:
                description: OccurrenceCount tracks how many times this pattern has
                  been seen.
                format: int32
                minimum: 0
                type: integer
              phase:
                description: Phase tracks the incident lifecycle.
                enum:
                - Detected
                - Investigating
                - Resolved
                - Recurring
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
