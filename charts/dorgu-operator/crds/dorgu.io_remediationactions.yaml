---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: remediationactions.dorgu.io
spec:
  group: dorgu.io
  names:
    kind: RemediationAction
    listKind: RemediationActionList
    plural: remediationactions
    shortNames:
    - ra
    singular: remediationaction
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.action.type
      name: Type
      type: string
    - jsonPath: .spec.planSource
      name: Plan
      type: string
    - jsonPath: .spec.confidence
      name: Confidence
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          RemediationAction is the Schema for the remediationactions API.
          It represents a proposed or applied remediation for a detected incident.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of RemediationAction.
            properties:
              action:
                description: |-
                  Action describes the remediation to apply.
                  Retained for back-compat: when Steps is empty, Action is the plan of record.
                properties:
                  patch:
                    description: Patch is the JSON merge patch to apply to the Persona
                      spec.
                    x-kubernetes-preserve-unknown-fields: true
                  prePatchState:
                    description: PrePatchState is the snapshot of fields before the
                      patch, for rollback.
                    x-kubernetes-preserve-unknown-fields: true
                  type:
                    description: Type classifies the remediation action.
                    enum:
                    - persona-update
                    - notification
                    - git-pr
                    type: string
                required:
                - type
                type: object
              approval:
                description: Approval configures the approval requirements for this
                  remediation.
                properties:
                  autoApproveRule:
                    description: |-
                      AutoApproveRule configures automatic approval after repeated successes.
                      Not yet implemented — no controller reads this field, so setting it grants
                      nothing. Every remediation requires human approval. Deferred to Phase 2c
                      (founder decision #7).
                    properties:
                      afterSuccessfulOccurrences:
                        default: 3
                        description: |-
                          AfterSuccessfulOccurrences is the number of successful identical remediations
                          required before auto-approval is granted.
                          Not yet implemented — see AutoApproveRule.
                        format: int32
                        minimum: 1
                        type: integer
                      enabled:
                        default: false
                        description: |-
                          Enabled activates auto-approve graduation.
                          Not yet implemented — see AutoApproveRule.
                        type: boolean
                    required:
                    - afterSuccessfulOccurrences
                    - enabled
                    type: object
                  deadline:
                    description: Deadline is when the pending remediation expires
                      if not approved.
                    format: date-time
                    type: string
                  required:
                    default: true
                    description: Required indicates whether human approval is needed.
                    type: boolean
                required:
                - required
                type: object
              confidence:
                description: Confidence is the diagnosis confidence score as a decimal
                  string (e.g., "0.85").
                pattern: ^(0(\.\d+)?|1(\.0+)?)$
                type: string
              explanation:
                description: Explanation provides a human-readable description of
                  why this remediation is proposed.
                type: string
              incidentRef:
                description: IncidentRef references the IncidentMemory that triggered
                  this remediation.
                properties:
                  name:
                    description: Name of the IncidentMemory.
                    type: string
                  namespace:
                    description: Namespace of the IncidentMemory.
                    type: string
                required:
                - name
                - namespace
                type: object
              personaRef:
                description: PersonaRef references the Persona to be remediated.
                properties:
                  kind:
                    description: Kind is ApplicationPersona or ClusterPersona.
                    enum:
                    - ApplicationPersona
                    - ClusterPersona
                    type: string
                  name:
                    description: Name of the referenced Persona.
                    type: string
                  namespace:
                    description: Namespace of the referenced Persona (empty for ClusterPersona).
                    type: string
                required:
                - kind
                - name
                type: object
              planSource:
                description: PlanSource records how the plan was produced.
                enum:
                - rule-based
                - ai-anthropic
                type: string
              planSummary:
                description: PlanSummary is the AI root-cause / plan explanation for
                  the ordered plan.
                type: string
              rollback:
                description: Rollback configures automatic rollback behavior.
                properties:
                  enabled:
                    default: true
                    description: Enabled activates automatic rollback on degradation.
                    type: boolean
                  healthCheckAfter:
                    description: HealthCheckAfter is the duration to wait before verifying
                      remediation health.
                    type: string
                  maxRetries:
                    default: 1
                    description: MaxRetries limits rollback attempts.
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - enabled
                - maxRetries
                type: object
              steps:
                description: |-
                  Steps is an ordered, multi-step remediation plan. When non-empty it is the
                  plan of record (and supersedes the single Action for planning purposes).
                  NOTE (this sprint): Steps is populated and validated but not yet executed;
                  the controller/executor continue to apply the single Action.
                items:
                  description: |-
                    RemediationStep is a single ordered action within a multi-step remediation plan.

                    Step-safety invariant: only persona-update steps may be AutoExecutable. All
                    other step types are advisory — recorded for a human/CLI/platform to apply —
                    which preserves the operator's non-negotiable guarantee that it never writes
                    workloads. See ValidateAutoExecutable.
                  properties:
                    autoExecutable:
                      description: |-
                        AutoExecutable indicates the operator may apply this step without external
                        action. v1 invariant: this is true ONLY for persona-update steps.
                      type: boolean
                    description:
                      description: Description is a human-readable summary of the
                        action.
                      type: string
                    id:
                      description: ID is a stable, per-plan identifier for the step.
                      type: string
                    order:
                      description: Order is the 1-based execution order of this step
                        within the plan.
                      format: int32
                      minimum: 1
                      type: integer
                    patch:
                      description: Patch is the JSON merge patch to apply to the Persona
                        spec (persona-update steps).
                      x-kubernetes-preserve-unknown-fields: true
                    prePatchState:
                      description: PrePatchState is the snapshot of fields before
                        the patch, for rollback.
                      x-kubernetes-preserve-unknown-fields: true
                    rationale:
                      description: Rationale explains why this step is proposed (AI
                        reasoning).
                      type: string
                    risk:
                      description: Risk is the assessed risk level of applying this
                        step.
                      enum:
                      - low
                      - medium
                      - high
                      type: string
                    type:
                      description: Type classifies the step action.
                      enum:
                      - persona-update
                      - workload-apply
                      - restart
                      - scale
                      - config-change
                      - manual
                      type: string
                  required:
                  - autoExecutable
                  - description
                  - id
                  - order
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: only persona-update steps may be autoExecutable
                    rule: '!self.autoExecutable || self.type == ''persona-update'''
                type: array
                x-kubernetes-list-type: atomic
              trustLevel:
                description: TrustLevel is the minimum trust level required to execute
                  this remediation.
                format: int32
                maximum: 5
                minimum: 0
                type: integer
            required:
            - action
            - confidence
            - explanation
            - incidentRef
            - personaRef
            - trustLevel
            type: object
          status:
            description: Status defines the observed state of RemediationAction.
            properties:
              appliedAt:
                description: AppliedAt is when the remediation patch was applied.
                format: date-time
                type: string
              approvedAt:
                description: ApprovedAt is when the remediation was approved.
                format: date-time
                type: string
              approvedBy:
                description: ApprovedBy identifies who approved the remediation.
                type: string
              conditions:
                description: Conditions are standard K8s conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentStep:
                description: |-
                  CurrentStep is the 1-based order of the step currently being executed.
                  Schema only this sprint — not yet driven by the controller.
                format: int32
                type: integer
              phase:
                description: Phase tracks the remediation lifecycle.
                enum:
                - Pending
                - Approved
                - Applying
                - Verifying
                - Completed
                - RolledBack
                - Failed
                - Rejected
                - Expired
                type: string
              stepStatuses:
                description: |-
                  StepStatuses tracks per-step execution outcome for the ordered plan.
                  Schema only this sprint — not yet driven by the controller.
                items:
                  description: StepStatus tracks the execution outcome of a single
                    RemediationStep.
                  properties:
                    appliedAt:
                      description: AppliedAt is when the step was applied.
                      format: date-time
                      type: string
                    order:
                      description: Order is the 1-based order of the step this status
                        refers to.
                      format: int32
                      minimum: 1
                      type: integer
                    phase:
                      description: Phase tracks the step lifecycle.
                      enum:
                      - Pending
                      - Applied
                      - Verified
                      - Failed
                      - Skipped
                      type: string
                    verificationResult:
                      description: VerificationResult is the outcome of post-apply
                        verification for this step.
                      type: string
                  required:
                  - order
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              verificationResult:
                description: VerificationResult is the outcome of post-apply health
                  verification.
                enum:
                - Healthy
                - Degraded
                - Unknown
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
