{{- if .Values.metrics.enabled }}
# Scrape target for the operator's /metrics endpoint. With metrics.secure=true
# (the default) a scraper must present a ServiceAccount token whose identity is
# bound to the metrics-reader ClusterRole below.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dorgu-operator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dorgu-operator.labels" . | nindent 4 }}
spec:
  ports:
    - name: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
      port: {{ regexFind "[0-9]+$" .Values.metrics.bindAddress | int }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "dorgu-operator.selectorLabels" . | nindent 4 }}
---
# Bind this to the identity of whatever scrapes the operator, for example:
#   kubectl create clusterrolebinding prometheus-dorgu-metrics \
#     --clusterrole={{ include "dorgu-operator.fullname" . }}-metrics-reader \
#     --serviceaccount=monitoring:prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dorgu-operator.fullname" . }}-metrics-reader
  labels:
    {{- include "dorgu-operator.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
{{- end }}
