apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dorgu-operator.fullname" . }}-manager
  labels:
    {{- include "dorgu-operator.labels" . | nindent 4 }}
rules:
  # ApplicationPersona CRD
  - apiGroups: ["dorgu.io"]
    resources: ["applicationpersonas"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["dorgu.io"]
    resources: ["applicationpersonas/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["dorgu.io"]
    resources: ["applicationpersonas/finalizers"]
    verbs: ["update"]
  # ClusterPersona CRD (cluster-scoped)
  - apiGroups: ["dorgu.io"]
    resources: ["clusterpersonas"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["dorgu.io"]
    resources: ["clusterpersonas/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["dorgu.io"]
    resources: ["clusterpersonas/finalizers"]
    verbs: ["update"]
  # Deployments (read-only)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  # ArgoCD Applications (when argocd.enabled and ArgoCD is installed)
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  # Pods, namespaces, nodes (ClusterPersona discovery)
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader election (required when leaderElection.enabled=true)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dorgu-operator.fullname" . }}-manager
  labels:
    {{- include "dorgu-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dorgu-operator.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "dorgu-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
