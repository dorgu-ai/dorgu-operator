{{- /*
  Chart-managed Secret holding the Anthropic API key (DEV convenience path).
  Rendered only when llm.createSecret=true AND llm.apiKey is set AND no
  existingSecret is provided. In production, create a Secret out-of-band and
  set llm.existingSecret instead — existingSecret always wins and this template
  is skipped. Either way the key reaches the operator via secretKeyRef, never
  as an inline pod-spec arg.

  WARNING: passing llm.apiKey via values means the raw key is still visible to
  `helm get values` / `helm template`. Only llm.existingSecret keeps the key
  fully out of Helm's view.
*/}}
{{- if and .Values.llm.createSecret .Values.llm.apiKey (not .Values.llm.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dorgu-operator.fullname" . }}-llm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dorgu-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.llm.existingSecretKey | default "ANTHROPIC_API_KEY" }}: {{ .Values.llm.apiKey | quote }}
{{- end }}
